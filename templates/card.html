<a class="tile{{tile_class}}" href="{{href}}">
      <span class="tag mono">{{category}}</span>
      <span class="art"><img src="{{icon}}" alt="" width="320" height="180"></span>
      <span class="cap">
        <span class="t">{{title}}</span>
        <span class="d">{{summary}}</span>
        <span class="foot">
          <span class="path mono">{{path_label}}</span>{{open}}
          <span class="status mono"><span class="{{glyph}}" aria-hidden="true"></span>{{status_word}}</span>
        </span>
      </span>
    </a>
