    <style>
      .ink { stroke: #1c1917; stroke-width: 1.15; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .ink-dim { stroke: #5c5348; stroke-width: 0.95; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .hair { stroke: #766b5f; stroke-width: 0.75; stroke-opacity: 0.55; stroke-linecap: round; fill: none; }
      .loop { stroke: #5c5348; stroke-width: 1.0; stroke-dasharray: 3 3; stroke-linecap: round; fill: none; }
      .slab-face { fill: #ffffff; stroke: #1c1917; stroke-width: 1.15; stroke-linejoin: round; }
      .slab-side { fill: #ede7dc; stroke: #1c1917; stroke-width: 1.15; stroke-linejoin: round; }
      .slab-front { fill: #f6f2ea; stroke: #1c1917; stroke-width: 1.15; stroke-linejoin: round; }
      .pedestal-top { fill: #fbf9f5; stroke: #1c1917; stroke-width: 1.15; stroke-linejoin: round; }
      .pedestal-front { fill: #efeae0; stroke: #1c1917; stroke-width: 1.15; stroke-linejoin: round; }
      .pedestal-side { fill: #e5dfd2; stroke: #1c1917; stroke-width: 1.15; stroke-linejoin: round; }
      .pod-top { fill: #faf7f2; stroke: #1c1917; stroke-width: 1.0; stroke-linejoin: round; }
      .pod-front { fill: #ece5d8; stroke: #1c1917; stroke-width: 1.0; stroke-linejoin: round; }
      .pod-side { fill: #e0d8ca; stroke: #1c1917; stroke-width: 1.0; stroke-linejoin: round; }
      .rail-solid { stroke: #1c1917; stroke-width: 1.25; stroke-linecap: round; fill: none; }
      .rail-dim { stroke: #766b5f; stroke-width: 0.85; stroke-linecap: round; stroke-opacity: 0.6; fill: none; }

      @keyframes dashflow { from { stroke-dashoffset: 0; } to { stroke-dashoffset: -24; } }
      @keyframes beaconpulse { 0%, 100% { transform: scale(1); opacity: 0.45; } 50% { transform: scale(1.6); opacity: 0.95; } }
      @keyframes scanbeam { 0%, 100% { opacity: 0.4; } 50% { opacity: 1; } }
      .anim-loop { animation: dashflow 4s linear infinite; }
      .anim-beacon { transform-box: fill-box; transform-origin: center; animation: beaconpulse 2s ease-in-out infinite; }
      .anim-scan { animation: scanbeam 2s ease-in-out infinite; }

      @media (prefers-reduced-motion: reduce) {
        .anim-loop, .anim-beacon, .anim-scan { animation: none !important; }
      }
    </style>
