name: security

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    name: Secret scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  links:
    name: Link integrity (documentation & references)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --no-progress
            --exclude 'localhost'
            --exclude 'mailto:'
            --exclude 'linkedin\.com'
            --exclude 'ivanjairus\.xyz'
            --exclude 'ij-'
            --exclude '<slug>'
            --exclude '^/'
            README.md LICENSE.md
          fail: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  security-policy:
    name: Baseline security headers policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
      - name: Assert mandatory security headers in vercel.base.json
        run: |
          node --input-type=module -e '
          import { readFileSync } from "node:fs";
          const base = JSON.parse(readFileSync("registry/vercel.base.json", "utf8"));
          const headers = base.headers[0].headers.map(h => h.key.toLowerCase());
          const required = [
            "content-security-policy",
            "strict-transport-security",
            "x-content-type-options",
            "referrer-policy",
            "permissions-policy"
          ];
          for (const r of required) {
            if (!headers.includes(r)) {
              console.error(`Missing mandatory security header in vercel.base.json: ${r}`);
              process.exit(1);
            }
          }
          console.log("All baseline security headers present in vercel.base.json");
          '
