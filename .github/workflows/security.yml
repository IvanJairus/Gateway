name: security

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    name: Secret scanning
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # The binary is fetched by hand rather than through gitleaks-action, because that
      # action scans the push range GitHub hands it: after a history rewrite the range is
      # <root commit>^..HEAD, git writes "unknown revision" to stderr, and gitleaks prints
      # "failed to scan Git repository" then "no leaks found in partial scan". It checked
      # nothing and called that clean. Full history also means a rule added later reaches
      # commits made earlier.
      - name: Fetch gitleaks and verify its digest
        run: |
          set -euo pipefail
          v=8.24.3
          curl -fsSL --retry 3 -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${v}/gitleaks_${v}_linux_x64.tar.gz"
          echo "9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks version
          echo "scanning $(git rev-list --count HEAD) reachable commits on $(git rev-parse --abbrev-ref HEAD)"

      - name: Scan every commit reachable from this checkout
        run: ./gitleaks git --redact --no-banner --report-format=sarif --report-path=gitleaks.sarif --log-level=warn .

      - name: Upload SARIF to code scanning
        if: always() && hashFiles('gitleaks.sarif') != ''
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4
        with:
          sarif_file: gitleaks.sarif

  links:
    name: Link integrity (documentation & references)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --no-progress
            --exclude 'localhost'
            --exclude 'mailto:'
            --exclude 'linkedin\.com'
            --exclude 'ivanjairus\.xyz'
            --exclude 'ij-'
            --exclude '<slug>'
            --exclude '^/'
            README.md LICENSE.md
          fail: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  security-policy:
    name: Baseline security headers policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
      - name: Assert mandatory security headers in vercel.base.json
        run: |
          node --input-type=module -e '
          import { readFileSync } from "node:fs";
          const base = JSON.parse(readFileSync("registry/vercel.base.json", "utf8"));
          const headers = base.headers[0].headers.map(h => h.key.toLowerCase());
          const required = [
            "content-security-policy",
            "strict-transport-security",
            "x-content-type-options",
            "referrer-policy",
            "permissions-policy"
          ];
          for (const r of required) {
            if (!headers.includes(r)) {
              console.error(`Missing mandatory security header in vercel.base.json: ${r}`);
              process.exit(1);
            }
          }
          console.log("All baseline security headers present in vercel.base.json");
          '
